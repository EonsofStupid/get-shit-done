[package]
name = "vibepulse-gsd"
version = "0.1.0"
description = "Vibepulse GSD Desktop - Interactive CLI with guardrails for Get-Shit-Done"
authors = ["Vibepulse"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "vibepulse_gsd_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "vibepulse-gsd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
regex = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[features]
default = ["tauri-app"]
# Enable the full Tauri application (requires GTK/WebKit system libs)
tauri-app = ["tauri", "tauri-plugin-shell", "tauri-build"]
custom-protocol = ["tauri/custom-protocol"]
